server:
  port: 4110

spring:
  application:
    name: test

  datasource:
    url: jdbc:postgresql://localhost:5432/allobank
    username: postgres
    password: anime021
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: splitbill
    show-sql: true

  sql:
    init:
      mode: never

  jackson:
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false

app:
  github-username: lukmnh